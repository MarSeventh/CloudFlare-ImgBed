name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker Name'
        required: false
        default: ''

# 所有配置均通过 Secrets 传入（public 仓库的 Variables 对所有人可见，不安全）
#
# 在仓库 Settings → Secrets and variables → Actions → Secrets 中配置：
#
# 必填：
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token（需要 Workers 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
#
# 数据库（二选一）：
#   D1_DATABASE_ID        - D1 数据库 ID
#   KV_NAMESPACE_ID       - KV 命名空间 ID
#
# 可选：
#   R2_BUCKET_NAME        - R2 存储桶名称
#   WORKER_NAME           - Worker 名称（默认 cloudflare-imgbed，手动触发时可在界面覆盖）
#   WORKER_VARS           - JSON 格式的业务环境变量，支持 value 和可选 type（text/secret，默认 text）。
#                           非必要不建议配置，业务设置请在管理面板中配置。
#   WRANGLER_CONFIG      - JSON 格式的额外 Wrangler 配置，如 workers_dev、observability
#   EXPIRY_CLEANUP_CRON   - 文件有效期清理的 Cron 表达式（如 */30 * * * *），启用文件有效期时配置；
#                           免费计划每个账号最多 5 个 Cron Trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 仅在 fork 仓库且配置了 Cloudflare secrets 时运行
    # 原仓库 push 和未配置 secrets 的 fork 不会触发部署
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Check deployment config
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping Worker deployment"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Generate build identity
        id: build_info
        if: steps.check.outputs.skip != 'true'
        run: node scripts/build-info.mjs --write-manifest --github-output "$GITHUB_OUTPUT" > /dev/null

      - name: Install Worker production dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          pnpm install --prod --frozen-lockfile \
            --filter @cloudflare-imgbed/common \
            --filter @cloudflare-imgbed/worker

      - name: Generate worker routes
        if: steps.check.outputs.skip != 'true'
        run: node deploy/worker/generate-routes.js

      - name: Generate wrangler config
        id: config
        if: steps.check.outputs.skip != 'true'
        env:
          WORKER_NAME: ${{ inputs.worker_name || secrets.WORKER_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WORKER_VARS: ${{ secrets.WORKER_VARS }}
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
          EXPIRY_CLEANUP_CRON: ${{ secrets.EXPIRY_CLEANUP_CRON }}
          APP_VERSION: ${{ steps.build_info.outputs.version }}
          APP_COMMIT_SHA: ${{ steps.build_info.outputs.commit }}
          APP_BUILD_ID: ${{ steps.build_info.outputs.build_id }}
          APP_BUILD_DIRTY: ${{ steps.build_info.outputs.dirty }}
          ASSET_PACKAGE_VERSION: ${{ steps.build_info.outputs.package_version }}
          FRONTEND_DIST_SHA256: ${{ steps.build_info.outputs.frontend_dist_sha256 }}
        run: node deploy/worker/generate-toml.js

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config deploy/worker/wrangler.toml

      - name: Upload Worker secrets
        if: steps.check.outputs.skip != 'true' && steps.config.outputs.has_secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: secret bulk "${{ steps.config.outputs.secrets_path }}" --config deploy/worker/wrangler.toml

      - name: Clean up Worker secrets file
        if: always() && steps.config.outputs.has_secrets == 'true'
        env:
          WORKER_SECRETS_FILE: ${{ steps.config.outputs.secrets_path }}
        run: rm -f -- "$WORKER_SECRETS_FILE"
