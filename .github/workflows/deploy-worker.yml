name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker Name'
        required: false
        default: ''

# 所有配置均通过 Secrets 传入（public 仓库的 Variables 对所有人可见，不安全）
#
# 在仓库 Settings → Secrets and variables → Actions → Secrets 中配置：
#
# 必填：
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token（需要 Workers 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
#
# 数据库（二选一）：
#   D1_DATABASE_ID        - D1 数据库 ID
#   KV_NAMESPACE_ID       - KV 命名空间 ID
#
# 可选：
#   R2_BUCKET_NAME        - R2 存储桶名称
#   WORKER_NAME           - Worker 名称（默认 cloudflare-imgbed，手动触发时可在界面覆盖）
#   WORKER_VARS           - JSON 格式的业务环境变量（非必要不建议配置，
#                           部署完成后请在管理面板中配置所有设置）

# 避免連續 Push 導致 Job 塞爆 Queued
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 避免 Cloudflare API 回應逾時導致無限卡住
    steps:
      - name: Check deployment config
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping Worker deployment"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci --workspace=@cloudflare-imgbed/common --workspace=@cloudflare-imgbed/worker --omit=dev

        # 1.1 設定 opencc-cli 的 node_modules 快取
      - name: Cache OpenCC CLI
        id: cache-opencc
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-opencc-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-opencc-

      # 1.2 未命中快取才跑 npm install，否則 0 秒跳過
      - name: Auto Patch & s2t for Upstream Build
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ "${{ steps.cache-opencc.outputs.cache-hit }}" != 'true' ]; then
            npm install opencc-cli
          fi

          # 1. 執行簡轉繁 (使用絕對路徑)
          find frontend-dist/js functions/api/manage/sysConfig/page.js -type f -name "*.js" -exec sh -c '$(pwd)/node_modules/.bin/opencc -i "$1" -o "$1.tmp" -c s2hk.json && mv "$1.tmp" "$1"' _ {} \;
      
          # 2. 詞彙修補 (sed 批次替換，改用 # 做分隔符避免路徑錯亂)
          find frontend-dist/js functions/api/manage/sysConfig/page.js  functions -type f -exec sed -i 's#簡體中文#正體中文#g; s#圖牀#圖床#g; s#粘貼#貼上#g' {} +
      
          # 3. 移除特定 CSS font-family 樣式
          find frontend-dist/css -type f -exec sed -i 's#font-family:Courier New,Monaco,monospace;##g' {} +
      
          # 4. 移除 Title 上的 GitHub 超連結 (改用 @ 作為分隔符，乾淨不報錯)
          find frontend-dist/js -type f -exec sed -i 's@{class:"main-title",href:"https://github.com/MarSeventh/CloudFlare-ImgBed",target:"_blank"}@{class:"main-title"}@g' {} +
      
          # 5. 修改 HTML Title 與 Logo (Favicon)
          sed -i 's#<title>.*</title>#<title>Misaki Imghub</title>#g' frontend-dist/index.html
          sed -i 's#href="/static/media/logo.png"#href="/static/media/QB.jpg"#g' frontend-dist/index.html

      - name: Generate worker routes
        if: steps.check.outputs.skip != 'true'
        run: node deploy/worker/generate-routes.js

      - name: Generate wrangler config
        if: steps.check.outputs.skip != 'true'
        env:
          WORKER_NAME: ${{ github.ref_name == 'uat' && 'imgbed-uat' || (inputs.worker_name || secrets.WORKER_NAME) }}
          D1_DATABASE_ID: ${{ github.ref_name == 'uat' && secrets.UAT_D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ github.ref_name == 'uat' && secrets.UAT_KV_NAMESPACE_ID || secrets.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ github.ref_name == 'uat' && secrets.UAT_R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
          WORKER_VARS: ${{ secrets.WORKER_VARS }}
        run: node deploy/worker/generate-toml.js

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config deploy/worker/wrangler.toml
          
