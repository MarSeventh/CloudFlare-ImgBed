# AnimeLK Storage - Cloudflare Workers deployment configuration
# Usage: npx wrangler deploy --config deploy/worker/wrangler.toml
#
# Configure the following bindings before deploying:
# 1. D1 database - uncomment and fill in your database_id
# 2. R2 bucket - uncomment and fill in your bucket_name
# 3. KV namespace - if using KV instead of D1, uncomment and fill in the id
# 4. Plain environment variables - configure under [vars]; for sensitive values use wrangler secret put/bulk
#
# When deploying via GitHub Actions, this file is generated automatically from GitHub Secrets.
# WORKER_VARS supports { "variable": { "value": "...", "type": "text|secret" } },
# type defaults to text; secrets are uploaded after deployment and are not written to [vars].
# No manual editing needed. See .github/workflows/deploy-worker.yml for details.

name = "animelk-storage"
main = "index.js"
compatibility_date = "2024-08-21"
# Make the Worker's own fetch() to its zone go through the public entry, not directly to origin.
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[images]
binding = "IMAGES"

[vars]
# AI_CONFIG_SECRET should be configured as a Secret: a random secret of at least 32 characters.
# TG_BOT_TOKEN = ""
# TG_CHAT_ID = ""

# [[d1_databases]]
# binding = "img_d1"
# database_name = "img_d1"
# database_id = ""

# [[r2_buckets]]
# binding = "img_r2"
# bucket_name = ""

# [[kv_namespaces]]
# binding = "img_url"
# id = ""
# Secret-type variables are uploaded separately after deployment and are not written to this config.
